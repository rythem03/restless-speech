name: "Restless Speech - Windows installer"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      platform: "windows-latest"
      target: "x86_64-pc-windows-msvc"
      build-args: ""
      sign-binaries: false
      asset-prefix: "restless-speech"
      upload-artifacts: true
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: restless-speech-x86_64-pc-windows-msvc
          path: dist
      - name: Use dashes instead of spaces in file names
        run: find dist -type f -name "* *" -exec bash -c 'for f; do mv "$f" "${f// /-}"; done' _ {} +
      - name: Remove previous downloads from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(gh api repos/${{ github.repository }}/releases/tags/latest --jq '.assets[].id' 2>/dev/null); do
            gh api -X DELETE repos/${{ github.repository }}/releases/assets/$id
          done
      - name: Publish installer as the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RESTLESS SPEECH (latest build)
          body: |
            Free, open-source, offline dictation for Windows.
            Download the `-setup.exe` file below and run it.
            Based on Handy by CJ Pais (MIT License).
          files: dist/**/*
          make_latest: true
